[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musixporter"
version = "2.0.0"
description = "Export a Deezer / YouTube Music library to Monochrome (Tidal)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "rich>=13",
    "ytmusicapi>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
musixporter = "musixporter.cli:main"

[tool.setuptools.packages.find]
include = ["musixporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
